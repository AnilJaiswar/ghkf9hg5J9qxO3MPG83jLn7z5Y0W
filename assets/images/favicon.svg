<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>

    <!-- Electric Cyan Glow Gradient -->
    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Ultra-Crisp Titanium White -->
    <linearGradient id="pureTitanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Polished Hardened Chrome / Steel Shackle -->
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00f5ff" />
    </linearGradient>

    <!-- Armored Lock Body Gradient -->
    <linearGradient id="lockBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f192e" />
      <stop offset="60%" stop-color="#080e1d" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>

    <!-- Recessed Security Core Chamber -->
    <linearGradient id="innerChamberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060c18" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#020306" stop-opacity="0" />
    </radialGradient>

    <!-- High-Impact Neon Drop Shadow -->
    <filter id="neonPop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f5ff" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Subtle Glow for LEDs and Core Nodes -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00f5ff" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Cyber Squircle Canvas (Borderless) -->
  <rect width="512" height="512" rx="112" fill="url(#cyberCanvas)" />
  <rect width="512" height="512" rx="112" fill="url(#ambientGlow)" />

  <!-- ========================================== -->
  <!--             SECURITY PADLOCK               -->
  <!-- ========================================== -->

  <!-- 1. The Shackle (Top Arch) -->
  <g id="padlockShackle">
    <!-- Shackle Ambient Laser Glow Stroke -->
    <path d="M 174 212 L 174 176 A 82 82 0 0 1 338 176 L 338 212" 
          fill="none" 
          stroke="#00f5ff" 
          stroke-width="48" 
          stroke-linecap="round" 
          opacity="0.25" />

    <!-- Main Polished Hardened Steel Shackle Bar -->
    <path d="M 174 212 L 174 176 A 82 82 0 0 1 338 176 L 338 212" 
          fill="none" 
          stroke="url(#shackleGrad)" 
          stroke-width="40" 
          stroke-linecap="round" />

    <!-- Specular Highlight Streak -->
    <path d="M 174 195 L 174 176 A 82 82 0 0 1 316 118" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.85" />
  </g>

  <!-- 2. The Lock Body with "AJ" Monogram Core -->
  <g filter="url(#neonPop)">
    <!-- Outer Armored Padlock Shell -->
    <rect x="96" y="194" width="320" height="234" rx="42" 
          fill="url(#lockBodyGrad)" 
          stroke="url(#laserCyan)" 
          stroke-width="3.5" />

    <!-- Hardened Shackle Entry Collars / Mount Bushings -->
    <rect x="146" y="190" width="56" height="12" rx="4" fill="#1e293b" stroke="#00f5ff" stroke-width="1.5" />
    <rect x="310" y="190" width="56" height="12" rx="4" fill="#1e293b" stroke="#00f5ff" stroke-width="1.5" />

    <!-- Inner Recessed Security Chamber -->
    <rect x="116" y="214" width="280" height="194" rx="28" 
          fill="url(#innerChamberGrad)" 
          stroke="rgba(0, 245, 255, 0.25)" 
          stroke-width="1.5" />

    <!-- Corner Hardware Security Rivets -->
    <circle cx="132" cy="230" r="3.5" fill="#00f5ff" opacity="0.6" />
    <circle cx="380" cy="230" r="3.5" fill="#00f5ff" opacity="0.6" />
    <circle cx="132" cy="392" r="3.5" fill="#00f5ff" opacity="0.6" />
    <circle cx="380" cy="392" r="3.5" fill="#00f5ff" opacity="0.6" />

    <!-- Watermarked Keyhole Silhouette in Chamber Background -->
    <g opacity="0.08" fill="#00f5ff">
      <circle cx="256" cy="286" r="32" />
      <polygon points="244,286 268,286 274,348 238,348" />
    </g>

    <!-- 3. The "AJ" Monogram inside Lock Body -->
    <g id="ajMonogram">
      <!-- Letter 'A' (Solid Precision Architectural Cut) -->
      <path d="M 193 236 
               C 196 236, 199 238, 201 243 
               L 254 381 
               C 256 386, 252 388, 247 388 
               L 224 388 
               C 220 388, 217 385, 215 381 
               L 204 352 
               L 182 352 
               L 171 381 
               C 169 385, 166 388, 162 388 
               L 139 388 
               C 134 388, 130 386, 132 381 
               L 185 243 
               C 187 238, 190 236, 193 236 
               Z 
               M 193 274 
               L 207 330 
               L 179 330 
               Z" 
            fill="url(#pureTitanium)" />

      <!-- Letter 'J' (Futuristic Cyan Terminal & Sweep) -->
      <path d="M 302 236 
               L 358 236 
               C 362 236, 364 238, 364 242 
               L 364 340 
               A 52 48 0 0 1 260 340 
               L 260 330 
               C 260 326, 263 323, 267 323 
               L 281 323 
               C 285 323, 288 326, 288 330 
               L 288 340 
               A 24 24 0 0 0 336 340 
               L 336 260 
               L 302 260 
               C 298 260, 296 257, 296 253 
               L 296 243 
               C 296 239, 298 236, 302 236 
               Z" 
            fill="url(#laserCyan)" />

      <!-- Cyber Accent Dot (Security Core) -->
      <circle cx="214" cy="272" r="6" fill="#00f5ff" filter="url(#subtleGlow)" />
    </g>
  </g>
</svg>
